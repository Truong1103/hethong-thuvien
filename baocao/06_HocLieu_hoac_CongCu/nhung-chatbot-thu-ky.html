<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nhúng chatbot thủ thư ảo</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; color: #16332f; background: #f2f8f5; }
    main { max-width: 960px; margin: 32px auto; padding: 0 20px; }
    h1 { font-size: 24px; }
    .embed-code { width: 100%; min-height: 120px; box-sizing: border-box; padding: 12px; border: 1px solid #b8d2c8; border-radius: 6px; background: #fff; font: 13px/1.5 Consolas, monospace; }
    iframe { display: block; width: 100%; height: 720px; border: 1px solid #b8d2c8; border-radius: 6px; background: #fff; }
  </style>
</head>
<body>
  <main>
    <h1>Mã nhúng chatbot thủ thư ảo</h1>
    <textarea class="embed-code" readonly><iframe src="https://hethong-thuvien.vercel.app/community/chat" title="Chatbot thủ thư ảo" width="100%" height="720" loading="lazy" style="border:0;"></iframe></textarea>
    <p>Bản xem trước:</p>
    <iframe src="https://hethong-thuvien.vercel.app/community/chat" title="Chatbot thủ thư ảo" loading="lazy" allow="microphone"></iframe>
    <noscript><p><a href="https://hethong-thuvien.vercel.app/community/chat">Mở chatbot thủ thư ảo</a></p></noscript>
  </main>
</body>
</html>
